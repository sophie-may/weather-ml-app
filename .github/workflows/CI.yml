name: CI

# (a) Detect changes: runs on every push / pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: sophiemayhenderson/weather-ml-app
  IMAGE_VERSION: v1          # change to v2 during the video demo

jobs:
  build-test-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # (b) Install Flask and dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          pip install -r requirements.txt

      # (c) Run each test file in its own step, in order
      - name: Run smoke test
        run: python -m unittest -v tests/smoke_test.py

      - name: Run unit test
        run: python -m unittest -v tests/unit_test.py

      - name: Run integration test
        run: python -m unittest -v tests/integration_test.py

      # (d) Build the Docker image from the Dockerfile
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:$IMAGE_VERSION \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      # (e) Build test: launch a container and run a command inside it
      - name: Build test - launch container
        run: |
          docker run -d --name build-test -p 5000:5000 $IMAGE_NAME:${{ github.sha }}
          sleep 10
          echo "Container state:"
          docker inspect -f '{{.State.Status}}' build-test
          if [ "$(docker inspect -f '{{.State.Running}}' build-test)" != "true" ]; then
            echo "Container is not running"; docker logs build-test; exit 1
          fi
          echo "Running a command inside the container:"
          docker exec build-test python --version
          docker exec build-test ls -la
          docker logs build-test

      - name: Clean up test container
        if: always()
        run: docker rm -f build-test || true

      # (f) Push the image to DockerHub (only for pushes to main, not PRs)
      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to DockerHub
        if: github.event_name != 'pull_request'
        run: |
          docker push $IMAGE_NAME:$IMAGE_VERSION
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
