name: CD

# (g) Deploy passed builds only: runs after CI finishes successfully on main
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

env:
  IMAGE_NAME: sophiemayhenderson/weather-ml-app

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    # Runs on the production server (EC2), where Minikube lives
    runs-on: self-hosted

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check cluster is reachable
        run: |
          kubectl get nodes
          kubectl get deployment weather-ml-app || true

      - name: Set image tag in deployment manifest
        run: |
          sed -i "s|IMAGE_TAG|${{ github.event.workflow_run.head_sha }}|" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      # (h) Deployment defined in yml files, applied with a rolling update
      - name: Apply Kubernetes manifests (rolling update)
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout to finish
        run: kubectl rollout status deployment/weather-ml-app --timeout=180s

      - name: Show deployed state
        run: |
          kubectl get deployment weather-ml-app -o wide
          kubectl get pods -l app=weather-ml-app -o wide
          kubectl get service weather-ml-service
          kubectl rollout history deployment/weather-ml-app
