apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
  labels:
    app: weather-ml-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-ml-app          # must match the label Task 3 created
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never drop below 2 running pods
      maxSurge: 1                  # bring up 1 new pod at a time
  template:
    metadata:
      labels:
        app: weather-ml-app
    spec:
      containers:
        - name: weather-ml-app     # same container name kubectl create gave it
          image: sophiemayhenderson/weather-ml-app:IMAGE_TAG   # replaced by CD.yml
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:          # only send traffic once the app answers
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
